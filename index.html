<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="班表小幫手">
<meta name="theme-color" content="#151d4b">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>班表小幫手</title>
<style>
/* 版面：沿用「薪資出勤」的設計——深藍漸層頂欄、淺灰藍底、白色圓角卡片與日期格、底部分頁列（藍色底線） */
:root{
  --bg:#f1f4f9;--surface:#ffffff;--sheet:#ffffff;--fg:#0f1f3d;--ink2:#334155;--muted:#64748b;--line:#e2e8f0;--hair:#e2e8f0;
  --cell:#ffffff;--out:#f8fafc;--outfg:#a3b0c2;--accent:#2549e0;--icon:#1e2f7d;--navy:#1e2f7d;--sky:#eef4ff;
  --today:#fffbeb;--todayline:#fbbf24;--danger:#dc2626;--warn:#b45309;--chipline:#cbd5e1;--input:#ffffff;
  --badge:#dc2626;--soft:#f1f5f9;--sun:#dc2626;--sat:#2549e0;--notebg:#fef3c7;--notefg:#78350f;
  --hdr:linear-gradient(135deg,#151d4b,#1e339e 55%,#2549e0);--grad:linear-gradient(135deg,#1e339e,#2549e0);
  --shadow:0 4px 6px -1px rgba(15,23,42,.06),0 2px 4px -2px rgba(15,23,42,.05);--shadow-sm:0 1px 2px rgba(15,23,42,.05);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1220;--surface:#131c2e;--sheet:#131c2e;--fg:#e2e8f0;--ink2:#cbd5e1;--muted:#94a3b8;--line:#26334d;--hair:#26334d;
  --cell:#162036;--out:#0f1729;--outfg:#4b5b75;--accent:#6d8bff;--icon:#a5b8ff;--navy:#a5b8ff;--sky:#1c2740;
  --today:#2a2310;--todayline:#f59e0b;--danger:#f87171;--warn:#fbbf24;--chipline:#334155;--input:#0f1729;
  --badge:#f87171;--soft:#1c2740;--sun:#f87171;--sat:#7c9cff;--notebg:#2e2610;--notefg:#fcd34d;
  --hdr:linear-gradient(135deg,#0a0f2c,#14236b 55%,#1d3bb8);--grad:linear-gradient(135deg,#1e339e,#3b5bff);
  --shadow:0 4px 10px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1220;--surface:#131c2e;--sheet:#131c2e;--fg:#e2e8f0;--ink2:#cbd5e1;--muted:#94a3b8;--line:#26334d;--hair:#26334d;
  --cell:#162036;--out:#0f1729;--outfg:#4b5b75;--accent:#6d8bff;--icon:#a5b8ff;--navy:#a5b8ff;--sky:#1c2740;
  --today:#2a2310;--todayline:#f59e0b;--danger:#f87171;--warn:#fbbf24;--chipline:#334155;--input:#0f1729;
  --badge:#f87171;--soft:#1c2740;--sun:#f87171;--sat:#7c9cff;--notebg:#2e2610;--notefg:#fcd34d;
  --hdr:linear-gradient(135deg,#0a0f2c,#14236b 55%,#1d3bb8);--grad:linear-gradient(135deg,#1e339e,#3b5bff);
  --shadow:0 4px 10px rgba(0,0,0,.35);--shadow-sm:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
/* 一個螢幕的 App 版面：頂欄／內容（班表不捲動，清單在內容區內捲動）／分頁列 */
html{height:100%;overflow:hidden}
body{margin:0;height:100%;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font-family:var(--font);color:var(--fg);background:var(--bg);-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;font-size:15px}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{flex:none;z-index:5;background:var(--surface);border-bottom:1px solid var(--hair);
  padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;height:calc(48px + env(safe-area-inset-top,0px))}
header h1{flex:1;text-align:center;font-size:18px;margin:0;font-weight:600;letter-spacing:1px}
header .side{width:64px}
header .menu-btn{background:none;border:0;color:var(--accent);font-size:17px;text-decoration:underline;padding:8px 0;width:64px;text-align:right}
main{flex:1;min-height:0;width:100%;max-width:620px;margin:0 auto;padding:8px max(10px,env(safe-area-inset-left,0px)) 8px max(10px,env(safe-area-inset-right,0px));overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
main.fit{overflow:hidden}
.view{flex:none}
#v-cal{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
/* 範例提示 */
.sample{flex:none;display:flex;align-items:center;gap:10px;background:var(--soft);border:1px dashed var(--chipline);border-radius:12px;padding:8px 12px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.sample span{flex:1}
.sample button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap}
/* 班表 */
/* 左右兩邊等寬，月份才會在正中間 */
.bar{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:52px}
.bar .bl{display:flex;justify-content:flex-start}
.bar .br{display:flex;justify-content:flex-end;gap:2px}
.ico{flex:none;background:none;border:0;padding:4px;color:var(--icon);border-radius:10px}
.ico svg{display:block;width:34px;height:34px}
.ico.on{background:color-mix(in srgb,var(--icon) 22%,transparent)}
.ico.hide{visibility:hidden}
.nav{min-width:0;display:flex;align-items:center;justify-content:center}
.nav button{flex:none;background:none;border:0;padding:6px 4px;color:var(--fg)}
.nav svg{width:26px;height:22px;display:block;fill:currentColor}
.nav .title{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center;min-width:0}
.week,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.week{flex:none}
.week div{text-align:center;font-size:13px;padding:3px 0}
.grid{flex:1;min-height:0;display:flex!important;flex-direction:column;border:1px solid var(--line);background:var(--line);gap:1px}
.wrow{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;position:relative}
.wrow.l1 .cell,.wrow.l2 .cell{justify-content:flex-start;gap:2px;padding-top:2px}
.wrow.l1 .cell .hn,.wrow.l2 .cell .hn{margin:0}
.wrow .cell .d,.wrow .cell .s{line-height:1.15}
.cbar{position:absolute;z-index:1;height:12px;font-size:9px;line-height:12px;border-radius:3px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;font-weight:600}
.cbar.late{background:#9aa3ae!important;color:#fff!important}
.cbar.dim{opacity:.5}
.cell .more{position:absolute;top:1px;left:2px;font-size:9px;font-weight:600;color:inherit;opacity:.8}
.cell{position:relative;min-height:0;background:var(--cell);color:var(--fg);display:flex;flex-direction:column;align-items:center;
  justify-content:space-evenly;padding:2px 0;overflow:hidden;font-variant-numeric:tabular-nums}
.cell .d{font-size:18px}
.cell .s{font-size:16px;white-space:nowrap;letter-spacing:-.5px}
.cell.s3 .s{font-size:13px}
.cell.s4 .s{font-size:11px}
.cell .star{position:absolute;top:1px;right:4px;font-size:14px;font-weight:700}
.cell .td{position:absolute;top:2px;left:2px;min-width:15px;height:15px;border-radius:8px;background:var(--badge);color:#fff;font-size:10px;line-height:15px;text-align:center;padding:0 3px;font-weight:600}
.cell.out{background:var(--out)!important;color:var(--outfg)!important}
.cell .td.old{background:#9aa3ae}
.cell.out .td{opacity:.45}
.cell.hol .d{font-weight:700}
.cell .hn{font-size:10px;line-height:14px;color:#c81e1e;background:rgba(255,255,255,.92);border-radius:7px;white-space:nowrap;max-width:calc(100% - 4px);overflow:hidden;text-overflow:ellipsis;padding:0 4px;margin:-4px 0;font-weight:600}
.cell .hn.mk{color:#7c2d12;background:#fcd34d}
.cell.out .hn{opacity:.6}
.tgl{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:12px;margin-top:8px;font-size:16px}
.tgl span{flex:1}
.tgl small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.tgl input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.hlist{font-size:14px;line-height:1.9;background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:8px 12px;margin-top:8px;font-variant-numeric:tabular-nums}
.cell.today{background:var(--today)!important;color:#000!important}
.cell.today::after{content:"";position:absolute;inset:0;border:2px solid var(--todayline);pointer-events:none}
.cell.flash{animation:fl .3s}
@keyframes fl{from{filter:brightness(.8)}to{filter:none}}
.stats{flex:none;margin:6px 0 0;font-size:12px;color:var(--muted);display:flex;gap:6px;overflow-x:auto;white-space:nowrap;min-height:22px}
.stats span{flex:none}
.stats span{background:var(--soft);border-radius:12px;padding:3px 10px;display:inline-flex;align-items:center;gap:5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--chipline)}
/* 清單共用 */
.panel-head{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.panel-head h2{font-size:22px;margin:0;flex:1}
.field{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--chipline);border-radius:10px;background:var(--input);color:var(--fg);font-family:inherit}
.addbar{display:flex;gap:6px;align-items:stretch;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:6px;margin-bottom:14px}
.addbar .field{border:0;padding:8px;min-width:0;flex:1}
.addbar .date{flex:none;width:118px;font-size:14px;border:1px solid var(--hair);border-radius:8px;background:var(--input);color:var(--fg);padding:0 6px;font-family:inherit}
.addbar button{flex:none;border:0;background:var(--accent);color:#fff;border-radius:10px;padding:0 14px;font-size:15px}
.addwrap{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:6px;margin-bottom:14px}
.addwrap .addbar{border:0;padding:0;margin:0;background:none}
.opts{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 4px 2px;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;align-items:center;gap:5px}
.opts input[type=date]{font-size:14px;border:1px solid var(--hair);border-radius:8px;background:var(--input);color:var(--fg);padding:5px 6px;font-family:inherit}
.opts input[type=number]{width:54px;font-size:15px;border:1px solid var(--hair);border-radius:8px;background:var(--input);color:var(--fg);padding:5px 6px;text-align:center;font-family:inherit}
.opts input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);margin:0}
.seg{display:flex;background:var(--hair);border-radius:9px;padding:2px}
.seg button{border:0;background:none;padding:6px 14px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tnav{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 8px}
.tnav b{font-size:18px;font-variant-numeric:tabular-nums;min-width:110px;text-align:center}
.tnav button{background:none;border:0;padding:4px 6px;color:var(--fg)}
.tnav svg{width:22px;height:18px;display:block;fill:currentColor}
.tcal{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.tweek{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));font-size:12px;color:var(--muted);text-align:center;padding:6px 0 4px;border-bottom:1px solid var(--hair)}
.twk{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));height:66px;border-bottom:1px solid var(--hair)}
.twk:last-child{border-bottom:0}
.tday{border:0;background:none;padding:3px 0 0;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--fg);font-variant-numeric:tabular-nums;position:relative;min-width:0}
.tday i{font-style:normal;width:20px;height:20px;line-height:20px;border-radius:10px;text-align:center}
.tday.out{color:var(--outfg)}
.tday.hol i{color:var(--danger);font-weight:600}
.tday.today i{background:var(--accent);color:#fff;font-weight:600}
.tday.sel{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tday .more{position:absolute;bottom:1px;font-size:10px;color:var(--muted)}
.tday .sh{position:absolute;top:4px;right:2px;width:6px;height:6px;border-radius:3px}
.tbar{position:absolute;height:13px;font-size:10px;line-height:13px;border-radius:3px;padding:0 3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none;font-weight:600}
.tbar.done{opacity:.4;text-decoration:line-through}
.plan{margin-top:12px;background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:10px 12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.plan-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.plan-h b{font-size:14px;color:var(--muted);font-weight:600}
.plan-h button{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--hair)}
.prow:first-child{border-top:0}
.prow .bx{flex:none;width:22px;height:22px;border:2px solid var(--fg);border-radius:4px;background:none;padding:0;display:grid;place-items:center}
.prow .bx svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.prow.done .bx{background:var(--muted);border-color:var(--muted)}
.prow.done .bx svg{opacity:1}
.prow .body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0;display:flex;align-items:center;gap:8px}
.prow .cl{flex:none;width:4px;align-self:stretch;border-radius:2px}
.prow .tx{flex:1;min-width:0;font-size:16px;word-break:break-word}
.prow .tx small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.prow.done .tx{text-decoration:line-through;color:var(--muted)}
.prow .tm{flex:none;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.prow.late .tm,.prow.late .tx small{color:var(--danger)}
.form{background:var(--surface);border:1px solid var(--hair);border-radius:12px;overflow:hidden}
.fr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-top:1px solid var(--hair);font-size:15px;min-height:48px}
.fr:first-child{border-top:0}
.fr span{flex:1;min-width:0}
.fr span small{display:block;font-size:11px;color:var(--muted)}
.fr input,.fr select{font-size:15px;color:var(--accent);background:none;border:0;text-align:right;font-family:inherit;max-width:60%}
.fr input[type=number]{width:60px;border:1px solid var(--hair);border-radius:6px;text-align:center;color:var(--fg);padding:4px}
.sw2{appearance:none;-webkit-appearance:none;width:50px!important;height:30px;border-radius:15px;background:var(--hair)!important;position:relative;transition:background .2s;flex:none;cursor:pointer}
.sw2::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw2:checked{background:var(--accent)!important}
.sw2:checked::after{left:23px}
#remBar{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top,0px));z-index:45;background:var(--surface);border:1px solid var(--hair);border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:12px;display:flex;gap:12px;align-items:center}
#remBar .ic{width:44px;height:44px;border-radius:22px;background:#8b5cf6;color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
#remBar .tx{flex:1;min-width:0}
#remBar .tx b{display:block;font-size:15px}
#remBar .tx span{font-size:13px;color:var(--muted)}
#remBar button{border:0;border-radius:8px;padding:8px 10px;font-size:14px;background:var(--hair);color:var(--fg)}
#remBar button.ok{background:var(--accent);color:#fff}
.cols{display:flex;flex-wrap:wrap;gap:10px}
.cols button{width:30px;height:30px;border-radius:15px;border:3px solid transparent;padding:0}
.cols button.on{border-color:var(--fg)}
.group{margin-bottom:16px}
.group h3{font-size:13px;color:var(--muted);margin:0 4px 6px;letter-spacing:.5px;display:flex;justify-content:space-between;align-items:center}
.group h3.late{color:var(--danger)}
.group h3 button{background:none;border:0;color:var(--accent);font-size:13px;padding:2px}
.list{background:var(--surface);border:1px solid var(--hair);border-radius:14px;overflow:hidden}
.todo{display:flex;align-items:flex-start;gap:10px;padding:11px 12px;border-top:1px solid var(--hair)}
.todo:first-child{border-top:0}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--chipline);background:none;padding:0;display:grid;place-items:center;margin-top:1px}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;opacity:0}
.todo.done .chk{background:var(--accent);border-color:var(--accent)}
.todo.done .chk svg{opacity:1}
.todo .body{flex:1;min-width:0;background:none;border:0;text-align:left;padding:0}
.todo .txt{font-size:16px;line-height:1.4;word-break:break-word}
.todo.done .txt{text-decoration:line-through;color:var(--muted)}
.todo .meta{font-size:12px;color:var(--muted);margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.todo .meta.late{color:var(--danger)}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;border:1px solid var(--chipline)}
.empty{text-align:center;color:var(--muted);padding:28px 12px;font-size:14px;line-height:1.7}
/* 備忘錄 */
.memos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.memo{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:12px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:6px;min-height:120px}
.memo b{font-size:15px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.memo p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;flex:1;white-space:pre-line}
.memo small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.memo.pin{border-color:var(--accent)}
.newbtn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px}
/* 分頁列 */
#tabs{flex:none;position:relative;z-index:7;background:var(--surface);border-top:1px solid var(--hair);
  display:flex;padding:4px max(8px,env(safe-area-inset-left,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
#tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px 0;position:relative}
#tabs button svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}
#tabs button.on{color:var(--accent)}
#tabs .n{position:absolute;top:2px;left:calc(50% + 8px);background:var(--badge);color:#fff;border-radius:8px;font-size:10px;min-width:16px;height:16px;line-height:16px;padding:0 4px}
body.editing #tabs{display:none}
/* 編輯列 */
#palette{flex:none;position:relative;z-index:8;background:var(--surface);border-top:1px solid var(--hair);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));box-shadow:0 -4px 14px rgba(0,0,0,.12)}
#palette .hint{font-size:12px;color:var(--muted);margin:0 4px 6px;display:flex;justify-content:space-between}

// 舊資料只有一組 cycle，改成多組 cycles

  const list=Array.isArray(d.cycles)?d.cycles:[];

let S=null;

if(!S||!Array.isArray(S.types))S=sampleData();
S.days=S.days||{};S.cycles=migrateCycles(S);delete S.cycle;S.memos=S.memos||[];S.todos=S.todos||[];S.hol=S.hol||{show:true,off:false};

const typeById=id=>S.types.find(t=>t.id===id);

const BLANK='x'; // 手動清成空白，蓋過循環

const holName=k=>S.hol.show||S.hol.off?HOLIDAYS[k]||'':'';
const offType=()=>typeById('o')||S.types.find(t=>t.name==='休假')||null;
function shiftOf(key){
  const e=S.days[key];
  if(e&&e.t===BLANK)return null;
  if(e&&e.t&&typeById(e.t))return typeById(e.t);
  if(S.hol.off&&HOLIDAYS[key]&&offType())return offType();
  const c=cycleAt(key);
  return c?typeById(c.seq[(dayNum(parse(key))-dayNum(parse(c.start)))%c.seq.length])||null:null;
}
// 這天適用哪一組循環：有好幾組重疊時，以開始日比較晚的那組為準
function cycleAt(key){
  let best=null;
  S.cycles.forEach(c=>{
    if(!c.seq.length||c.start>key)return;
    const end=cycleEnd(c);if(end&&key>end)return;
    if(!best||c.start>=best.start)best=c;
  });
  return best;
}
// 第 N 個月的最後一天；months 為 0／未設定＝不限
function cycleMonthEnd(c){
  if(!c.start||!c.months)return '';
  const d=parse(c.start);return ymd(new Date(d.getFullYear(),d.getMonth()+c.months,0));
}
// 循環實際結束日：月底那一輪沒輪完，就延到下個月把這輪排完
function cycleEnd(c){
  const me=cycleMonthEnd(c);if(!me||!c.seq.length)return me;
  const rem=(dayNum(parse(me))-dayNum(parse(c.start))+1)%c.seq.length;
  return rem?ymd(addDays(parse(me),c.seq.length-rem)):me;
}
function lum(hex){const h=(hex||'#fff').replace('#','');return (parseInt(h.substr(0,2),16)*299+parseInt(h.substr(2,2),16)*587+parseInt(h.substr(4,2),16)*114)/1000}
const textColor=hex=>lum(hex)<120?'#fff':'#111';
// 白色班別（休假）沿用主題的格子色，深色模式才不會刺眼
const paint=t=>!t||lum(t.color)>245?'':`background:${t.color};color:${textColor(t.color)}`;
const chipStyle=t=>lum(t.color)>245?'':`background:${t.color};color:${textColor(t.color)}`;
function monthCells(){

const ymOf=k=>k.slice(0,7);
const ymAdd=(ym,n)=>{const[y,m]=ym.split('-').map(Number),d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
// 每月重複的待辦在某個月的日期（31 號遇到小月就排月底）
// 重複方式：day 每天、week 每週、month 每月（舊資料用 monthly:true 代表每月）
const repOf=t=>t.date?(t.repeat||(t.monthly?'month':'')):'';
const REP_TXT={day:'每天',week:'每週',month:'每月'};
function occDate(t,ym){const[y,m]=ym.split('-').map(Number),day=parse(t.date).getDate(),last=new Date(y,m,0).getDate();return ym+'-'+pad(Math.min(day,last))}
const dueOf=(date,days)=>days>1?ymd(addDays(parse(date),days-1)):date;
// 把待辦展開成一筆一筆（每月重複的會在 from～to 每個月各一筆）
function todoItems(fromYm,toYm){
  const out=[];
  S.todos.forEach(t=>{
    const r=repOf(t);
    if(!r){out.push({t,key:t.id,date:t.date||'',due:t.date?dueOf(t.date,t.days):'',done:!!t.done});return}
    if(r==='day'||r==='week'){
      const step=r==='day'?1:7,from=parse(fromYm+'-01'),toK=ymd(new Date(+toYm.slice(0,4),+toYm.slice(5),0));
      let d=parse(t.date);
      if(d<from){const k=Math.ceil((dayNum(from)-dayNum(d))/step);d=addDays(d,k*step)}
      for(;ymd(d)<=toK;d=addDays(d,step)){const date=ymd(d);out.push({t,key:t.id+'@'+date,rd:1,date,due:dueOf(date,t.days),done:!!(t.doneM&&t.doneM[date])})}
      return;
    }
    for(let ym=fromYm>ymOf(t.date)?fromYm:ymOf(t.date);ym<=toYm;ym=ymAdd(ym,1)){
      const date=occDate(t,ym);
      out.push({t,key:t.id+'@'+ym,ym,date,due:dueOf(date,t.days),done:!!(t.doneM&&t.doneM[ym])});
    }
  });
  return out;
}

  // 依每列實際高度決定能畫幾條（放不下就改用數字）

  for(let w=0;w<6;w++){

function listItems(){

  all.forEach(it=>{

// 產生 .ics 行事曆檔，交給 iPhone 的「行事曆」加入並準時提醒
function icsOf(t){
  const e=x=>String(x).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
  const dt=k=>k.replace(/-/g,''),now=new Date(),stamp=now.toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const due=dueOf(t.date,t.days),rp=repOf(t),rem=t.remind||0,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//shift-helper//TW','CALSCALE:GREGORIAN','BEGIN:VEVENT',
    'UID:'+t.id+'@shift-helper','DTSTAMP:'+stamp,'SUMMARY:'+e(t.text)];
  if(t.time){
    const[h,mi]=t.time.split(':').map(Number),st=parse(t.date);st.setHours(h,mi);
    const en=t.days>1?(()=>{const x=parse(due);x.setHours(h,mi+30);return x})():new Date(+st+30*60000);
    const f=d=>ymd(d).replace(/-/g,'')+'T'+pad(d.getHours())+pad(d.getMinutes())+'00';
    L.push('DTSTART:'+f(st),'DTEND:'+f(en));
  }else L.push('DTSTART;VALUE=DATE:'+dt(t.date),'DTEND;VALUE=DATE:'+dt(ymd(addDays(parse(due),1))));
  if(rp)L.push('RRULE:FREQ='+{day:'DAILY',week:'WEEKLY',month:'MONTHLY'}[rp]);
  // 有時間：提早 N 分鐘；全天：當天 9:00 再往前 N 分鐘
  const m=t.time?-rem:540-rem;
  L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+e(t.text),'TRIGGER:'+(m<0?'-':'')+'PT'+Math.abs(m)+'M','END:VALARM','END:VEVENT','END:VCALENDAR');
  return L.join('\r\n')+'\r\n';
}
function addToCalendar(t,again){
  const url='data:text/calendar;charset=utf-8,'+encodeURIComponent(icsOf(t));
  openSheet(`<h2>加到 iPhone 行事曆<button data-x>關閉</button></h2>
    <div class="small">${again?'修改過的待辦要重新加一次，<b>舊的那筆請到「行事曆」刪掉</b>，以免重複提醒。<br>':''}按下面的按鈕，iPhone 會問要不要加入行事曆，選「加入全部」或「加入」。之後時間到，iPhone 會跳通知，App 沒開也會響。</div>
    <a class="btn" id="icsGo" href="${url}" style="text-align:center;text-decoration:none">📲 加入「${esc(t.text)}」</a>
    <div class="small" style="margin-top:10px">如果按了沒有反應：先用 Safari 開這個 App 的網址再按一次。</div>`);
}

// 手寫圖片和錄音存在 IndexedDB（localStorage 容量太小）
const FDB='shift-helper-files';
function idbReq(mode,fn){
  return new Promise((res,rej)=>{
    const o=indexedDB.open(FDB,1);
    o.onupgradeneeded=()=>o.result.createObjectStore('files');
    o.onerror=()=>rej(o.error);
    o.onsuccess=()=>{const db=o.result,tx=db.transaction('files',mode),r=fn(tx.objectStore('files'));
      tx.oncomplete=()=>{db.close();res(r&&r.result)};tx.onerror=()=>{db.close();rej(tx.error)}};
  });
}
const fileGet=id=>idbReq('readonly',st=>st.get(id));
const filePut=(id,blob)=>idbReq('readwrite',st=>st.put(blob,id));
const fileDel=id=>idbReq('readwrite',st=>st.delete(id)).catch(()=>{});

// 手寫畫面：回傳 PNG Blob；取消回傳 null
function openDraw(baseBlob){
  return new Promise(resolve=>{
    const box=$('draw'),cv=$('dwCv');box.hidden=false;
    const ctx=cv.getContext('2d'),dpr=Math.max(1,Math.min(3,window.devicePixelRatio||1));
    let strokes=[],cur=null,color='#111111',width=4,erase=false,base=null;
    const fit=()=>{const r=cv.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);redraw()};
    const line=st=>{
      ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=st.erase?'#ffffff':st.color;ctx.lineWidth=st.w*dpr*(st.erase?4:1);
      ctx.beginPath();st.pts.forEach((pt,i)=>i?ctx.lineTo(pt[0]*cv.width,pt[1]*cv.height):ctx.moveTo(pt[0]*cv.width,pt[1]*cv.height));
      if(st.pts.length===1)ctx.lineTo(st.pts[0][0]*cv.width+.1,st.pts[0][1]*cv.height);
      ctx.stroke();ctx.restore();
    };
    function redraw(){
      ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
      if(base){const k=Math.min(cv.width/base.width,cv.height/base.height);ctx.drawImage(base,(cv.width-base.width*k)/2,(cv.height-base.height*k)/2,base.width*k,base.height*k)}
      strokes.forEach(line);
    }
    const pos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};
    cv.onpointerdown=e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);cur={color,w:width,erase,pts:[pos(e)]};strokes.push(cur);line(cur)};
    cv.onpointermove=e=>{if(!cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>cur.pts.push(pos(ev)));
      const n=cur.pts.length;line({...cur,pts:cur.pts.slice(Math.max(0,n-evs.length-1))})};
    cv.onpointerup=cv.onpointercancel=()=>{cur=null};
    $('dwBar').onclick=e=>{
      const sw=e.target.closest('.sw'),tw=e.target.closest('[data-w]');
      if(sw){color=sw.dataset.c;erase=false;$('dwBar').querySelectorAll('.sw').forEach(x=>x.classList.toggle('on',x===sw));$('dwEr').classList.remove('on')}
      if(tw){width=+tw.dataset.w;$('dwBar').querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('on',x===tw))}
    };
    $('dwEr').onclick=()=>{erase=!erase;$('dwEr').classList.toggle('on',erase)};
    $('dwUndo').onclick=()=>{strokes.pop();redraw()};
    $('dwClr').onclick=async()=>{if(!strokes.length&&!base)return;if(!await ask('清除整張手寫？','清除',true))return;strokes=[];base=null;redraw()};
    const done=v=>{box.hidden=true;window.removeEventListener('resize',fit);cv.onpointerdown=cv.onpointermove=cv.onpointerup=null;resolve(v)};
    $('dwCancel').onclick=async()=>{if(strokes.length&&!await ask('不儲存這次的手寫？','不儲存',true))return;done(null)};
    $('dwSave').onclick=()=>{if(!strokes.length&&!base)return done(null);cv.toBlob(bl=>done(bl),'image/png')};
    window.addEventListener('resize',fit);
    requestAnimationFrame(()=>{
      fit();
      if(baseBlob){const im=new Image();im.onload=()=>{base=im;redraw()};im.src=URL.createObjectURL(baseBlob)}
    });
  });
}

// 錄音
let rec=null;
function recMime(){
  if(!window.MediaRecorder)return null;
  for(const t of ['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'])if(!MediaRecorder.isTypeSupported||MediaRecorder.isTypeSupported(t))return t;
  return '';
}
async function startRec(onDone,onTick){
  const mt=recMime();
  if(mt===null||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('這支手機不支援錄音');return false}
  let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){toast(e&&e.name==='NotAllowedError'?'請允許使用麥克風（設定 → Safari → 麥克風）':'無法開啟麥克風');return false}
  const mr=new MediaRecorder(stream,mt?{mimeType:mt}:undefined),chunks=[],t0=Date.now();
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(t=>t.stop());clearInterval(rec&&rec.tm);
    const dur=Math.round((Date.now()-t0)/1000);rec=null;
    if(chunks.length)onDone(new Blob(chunks,{type:mr.mimeType||mt||'audio/mp4'}),dur)};
  mr.start(1000);
  rec={mr,tm:setInterval(()=>onTick(Math.round((Date.now()-t0)/1000)),500)};
  return true;
}
const stopRec=()=>{if(rec&&rec.mr.state!=='inactive')rec.mr.stop()};
const fmtDur=n=>Math.floor(n/60)+':'+pad(n%60);

  async function renderAtts(){

        :`<div class="aud" data-f="${f.id}"><span>🎙 ${fmtDur(f.dur||0)}</span><audio controls preload="metadata" src="${u}"></audio><button class="x" data-rm aria-label="刪除">✕</button></div>`;
    }));
    if($('mmAtts'))$('mmAtts').innerHTML=parts.join('');
  }
  const addFile=async(type,blob,extra)=>{
    const f={id:'f'+uid(),type,at:Date.now(),...extra};

function cycleRange(c){const e=cycleEnd(c);return fmtYMD(c.start)+' 起'+(e?' ～ '+fmtYMD(e):'，不限')}
function openCycle(){
  const list=[...S.cycles].sort((a,b)=>a.start<b.start?-1:1);
  const seqMini=c=>c.seq.map(id=>{const t=typeById(id);return t?`<span style="${chipStyle(t)}">${esc(t.name)}</span>`:''}).join('');
  openSheet(`<h2>排班循環<button data-x>關閉</button></h2>
    <div class="small">可以設定好幾組循環，例如 10 月一組、11 月一組。日期重疊時，以<b>開始日比較晚</b>的那組為準；你手動設定的日子永遠優先。</div>
    <div id="cyList" style="margin-top:10px">${list.length?list.map(c=>`<div class="cyrow" data-id="${c.id}">
      <div class="cyhead"><b>${cycleRange(c)}</b><span>一輪 ${c.seq.length} 天${c.months?'・'+c.months+' 個月':''}</span></div>
      <div class="seq mini">${seqMini(c)}</div>
      <div class="cyacts"><button data-edit>修改</button><button data-del class="del">刪除</button></div></div>`).join('')
      :'<div class="empty" style="padding:16px">還沒有排班循環。</div>'}</div>
    <button class="btn" id="cyNew">＋ 新增排班循環</button>`);
  $('cyNew').onclick=()=>editCycle(null);
  $('cyList').onclick=async e=>{
    const row=e.target.closest('.cyrow');if(!row)return;
    const c=S.cycles.find(x=>x.id===row.dataset.id);if(!c)return;
    if(e.target.closest('[data-edit]'))return editCycle(c.id);
    if(e.target.closest('[data-del]')){
      if(!await ask(`刪除「${cycleRange(c)}」這組循環？手動設定的日子不受影響。`,'刪除',true))return;
      S.cycles=S.cycles.filter(x=>x.id!==c.id);save();renderCal();openCycle();
    }
  };
}
function editCycle(id){
  const old=id?S.cycles.find(x=>x.id===id):null;
  let seq=old?old.seq.filter(t=>typeById(t)):[],months=old?(old.months||0):1;
  const last=[...S.cycles].sort((a,b)=>a.start<b.start?1:-1)[0];
  // 新增時預設從目前看的月份 1 號開始
  const defStart=old?old.start:ymd(new Date(view.getFullYear(),view.getMonth(),1));
  const MS=[1,2,3,6,12,0];
  const seqHtml=()=>seq.length?seq.map(id=>{const t=typeById(id);return `<span style="${chipStyle(t)}">${esc(t.name)}</span>`}).join(''):'<span class="ph">點下面的班別依序加入</span>';
  const monHtml=()=>MS.map(m=>`<button class="chip${months===m?' sel':''}" data-m="${m}">${m?m+' 個月':'不限'}</button>`).join('');
  // 預覽：排到哪天、月底沒輪完延到哪天、和其他循環有沒有重疊
  const preview=()=>{
    const st=$('cyStart').value;
    if(!st||!seq.length)return '先選起始日、加入班別。';
    const c={start:st,seq,months},me=cycleMonthEnd(c),end=cycleEnd(c),d0=parse(st),L=seq.length;
    const ymdTxt=k=>{const d=parse(k);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`};
    let h;
    if(!end)h='一直排下去，不設結束月份。每個月月底沒輪完的會直接接到下個月。';
    else{
      const days=dayNum(parse(end))-dayNum(d0)+1;
      h=`排到 <b>${ymdTxt(end)}</b>，共 ${days} 天，剛好 ${days/L} 輪。`;
      if(end!==me){
        const ext=dayNum(parse(end))-dayNum(parse(me)),done=L-ext;
        h+=`<br>${parse(me).getMonth()+1}月底這一輪才排到第 ${done} 天，還差 ${ext} 天，會<b>延到 ${parse(end).getMonth()+1}/${parse(end).getDate()}</b> 把這輪排完。`;
      }else h+=`<br>${parse(me).getMonth()+1}月底剛好輪完，不用延。`;
    }
    const ov=S.cycles.filter(o=>o.id!==id).filter(o=>{const oe=cycleEnd(o);return (!end||o.start<=end)&&(!oe||st<=oe)});
    if(ov.length)h+=`<br><span style="color:var(--warn)">和「${ov.map(cycleRange).join('」、「')}」日期重疊，重疊的日子以開始日比較晚的為準。</span>`;
    return h;
  };
  openSheet(`<h2>${old?'修改排班循環':'新增排班循環'}<button data-back>返回</button></h2>
    <div class="small">設定一輪的班別順序，沒有手動設定的日子會依這個循環自動顯示。</div>
    <h3>起始日（循環的第 1 天）</h3><input class="field" type="date" id="cyStart" value="${defStart}">
    <h3>循環順序（一輪 <b id="cyN">${seq.length}</b> 天）</h3><div class="seq" id="cySeq">${seqHtml()}</div>
    <div class="chips" id="cyAdd" style="margin-top:8px">${S.types.map(t=>`<button class="chip" data-t="${t.id}" style="${chipStyle(t)}">＋${esc(t.name)}</button>`).join('')}</div>
    <div class="chips" style="margin-top:8px"><button class="chip" id="cyBack">⌫ 刪最後一個</button><button class="chip" id="cyClr">全部清空</button>${!old&&last?'<button class="chip" id="cyCopy">複製上一組順序</button>':''}</div>
    <h3>要排幾個月（從起始日那個月算起）</h3><div class="chips" id="cyMon">${monHtml()}</div>
    <div class="small" id="cyPrev" style="margin-top:10px;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:10px 12px"></div>
    <button class="btn" id="cySave">儲存</button>`);
  const upd=()=>{$('cySeq').innerHTML=seqHtml();$('cyN').textContent=seq.length;$('cyMon').innerHTML=monHtml();$('cyPrev').innerHTML=preview()};
  upd();
  $('sheet').querySelector('[data-back]').onclick=()=>openCycle();
  $('cyStart').oninput=upd;
  $('cyMon').onclick=e=>{const b=e.target.closest('[data-m]');if(!b)return;months=+b.dataset.m;upd()};
  $('cyAdd').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;seq.push(b.dataset.t);upd()};
  $('cyBack').onclick=()=>{seq.pop();upd()};
  $('cyClr').onclick=()=>{seq=[];upd()};
  const cp=$('cyCopy');if(cp)cp.onclick=()=>{seq=last.seq.filter(t=>typeById(t));upd()};
  $('cySave').onclick=()=>{
    const st=$('cyStart').value;if(!st)return toast('請選起始日');if(!seq.length)return toast('請加入至少一個班別');
    if(old)Object.assign(old,{start:st,seq,months});else S.cycles.push({id:uid(),start:st,seq,months});
    save();renderCal();toast(months?`已套用 ${months} 個月`:'已套用循環');openCycle();
  };
}
function openTypes(){
  const rows=()=>S.types.map((t,i)=>`<div class="trow" data-i="${i}"><input type="color" value="${t.color}" aria-label="顏色"><input class="field" type="text" value="${esc(t.name)}" maxlength="5" aria-label="名稱"><button data-del aria-label="刪除">✕</button></div>`).join('');
  openSheet(`<h2>班別設定<button data-x>關閉</button></h2>
    <div class="small">名稱最多 5 個字。刪除班別後，用到它的日子會變成空白。</div>
    <div id="tyList" style="margin-top:10px">${rows()}</div>
    <button class="btn gray" id="tyAdd">＋ 新增班別</button><button class="btn" id="tySave">儲存</button>`);
  const collect=()=>$('tyList').querySelectorAll('.trow').forEach(r=>{const t=S.types[+r.dataset.i];t.color=r.querySelector('[type=color]').value;t.name=r.querySelector('[type=text]').value.trim()||t.name});
  $('tyList').onclick=async e=>{
    if(!e.target.closest('[data-del]'))return;
    const i=+e.target.closest('.trow').dataset.i;collect();
    if(!await ask('刪除「'+S.types[i].name+'」？','刪除',true))return;
    S.types.splice(i,1);$('tyList').innerHTML=rows();
  };
  $('tyAdd').onclick=()=>{collect();S.types.push({id:'t'+uid(),name:'新班別',color:'#ffd6e0'});$('tyList').innerHTML=rows()};
  $('tySave').onclick=()=>{collect();save();if(brush&&brush!==BLANK&&brush!=='auto'&&!typeById(brush))brush=null;if(editing)renderPalette();closeSheet();toast('已儲存')};
}
// 外觀：auto 跟隨手機、light、dark、time 依時間（白天淺色、晚上深色）
const LOOK=[['auto','跟隨手機設定'],['light','淺色'],['dark','深色'],['time','依時間自動切換']];
function applyTheme(){
  const th=S.theme||{mode:'auto'},root=document.documentElement;let m=th.mode;
  if(m==='time'){const n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),a=th.day||'06:00',b=th.night||'18:00';
    m=(a<=b?(hm>=a&&hm<b):(hm>=a||hm<b))?'light':'dark'}
  if(m==='light'||m==='dark')root.dataset.theme=m;else delete root.dataset.theme;
  // 頂欄是深藍漸層，狀態列跟著用深藍
  const meta=document.querySelector('meta[name=theme-color]'),dark=getComputedStyle(root).colorScheme==='dark';
  if(meta)meta.content=dark?'#0a0f2c':'#151d4b';
}
function openLook(){
  const th=S.theme||{mode:'auto'};
  openSheet(`<h2>外觀<button data-x>關閉</button></h2>
    <div class="form" id="lkList">${LOOK.map(([v,l])=>`<label class="fr"><span>${l}${v==='auto'?'<small>手機設定成深色，App 就是深色</small>':v==='time'?'<small>白天淺色、晚上深色</small>':''}</span><input type="radio" name="lk" value="${v}"${th.mode===v?' checked':''}></label>`).join('')}</div>
    <div id="lkTime" ${th.mode==='time'?'':'hidden'}><h3>時間</h3><div class="form">
      <label class="fr"><span>☀️ 淺色開始</span><input type="time" id="lkDay" value="${th.day||'06:00'}"></label>
      <label class="fr"><span>🌙 深色開始</span><input type="time" id="lkNight" value="${th.night||'18:00'}"></label></div></div>
    <h3>班表上顯示待辦</h3><div class="form" id="lkTodo">${[['bar','彩色橫條','跟待辦月曆一樣，過期沒做的是灰色'],['num','紅色數字','只顯示那天有幾件'],['off','不顯示','']].map(([v,l,d])=>`<label class="fr"><span>${l}${d?`<small>${d}</small>`:''}</span><input type="radio" name="lkt" value="${v}"${(S.calTodo||'bar')===v?' checked':''}></label>`).join('')}</div>`);
  $('lkTodo').onchange=()=>{S.calTodo=$('lkTodo').querySelector('input:checked').value;save();renderCal()};
  const upd=()=>{const v=($('lkList').querySelector('input:checked')||{}).value||'auto';
    S.theme={mode:v,day:$('lkDay').value||'06:00',night:$('lkNight').value||'18:00'};$('lkTime').hidden=v!=='time';save();applyTheme()};
  $('lkList').onchange=upd;$('lkDay').onchange=$('lkNight').onchange=upd;
}
function openHol(){
  const ot=offType(),ys=[...new Set(Object.keys(HOLIDAYS).map(k=>k.slice(0,4)))];
  openSheet(`<h2>國定假日<button data-x>關閉</button></h2>
    <label class="tgl"><span>在班表上顯示國定假日<small>日期變紅色，並標出節日名稱</small></span><input type="checkbox" id="hShow"${S.hol.show?' checked':''}></label>
    <label class="tgl"><span>國定假日自動排成「${ot?esc(ot.name):'休假'}」<small>會蓋過排班循環；你手動設定的日子不受影響</small></span><input type="checkbox" id="hOff"${S.hol.off?' checked':''}${ot?'':' disabled'}></label>
    <div class="small" style="margin-top:12px">已內建 ${ys.join('、')} 年（依人事行政總處辦公日曆表，含補假）。</div>
    <div class="hlist">${Object.entries(HOLIDAYS).filter(([k])=>k>=ymd(today)).slice(0,14).map(([k,n])=>`${fmtMD(k)}　${n}`).join('<br>')}</div>`);
  $('hShow').onchange=()=>{S.hol.show=$('hShow').checked;save();renderCal()};
  $('hOff').onchange=()=>{S.hol.off=$('hOff').checked;save();renderCal();toast(S.hol.off?'國定假日已排成休假':'已取消')};
}
async function resetApp(){
  if(!await ask('清除全部資料並重新開始？班表、排班循環、備忘錄（含手寫和錄音）、待辦、設定都會刪除，無法復原。','全部清除',true))return;
  try{localStorage.removeItem(KEY)}catch(e){}
  try{indexedDB.deleteDatabase(FDB)}catch(e){}
  try{if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
  try{if(navigator.serviceWorker)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister()}catch(e){}
  S={types:JSON.parse(JSON.stringify(TYPES)),days:{},cycles:[],memos:[],todos:[],hol:{show:true,off:false}};save();
  location.reload();
}
async function wipeShifts(){
  if(!await ask('清除所有排班？包含每一天手動設定的班別和全部排班循環。備註、備忘錄、待辦會保留。','全部清除',true))return;
  Object.keys(S.days).forEach(k=>{delete S.days[k].t;if(!S.days[k].note)delete S.days[k]});
  S.cycles=[];save();closeSheet();toast('已清除所有排班');
}
async function clearMonth(){
  const y=view.getFullYear(),m=view.getMonth();
  if(!await ask(`把 ${y}年${m+1}月 的班別全部清成空白？（連排班循環的班也會清掉，備註保留）`,'清除',true))return;
  for(let d=new Date(y,m,1);d.getMonth()===m;d=addDays(d,1)){
    const k=ymd(d),e=S.days[k]||{};
    delete e.t;S.days[k]=e;
    if(shiftOf(k))e.t=BLANK; // 循環還會排到這天，就標成空白蓋掉
    if(!e.t&&!e.note)delete S.days[k];
  }
  save();closeSheet();toast(`已清除 ${m+1} 月班別`);
}
function openExport(){
  const txt=JSON.stringify(S);
  openSheet(`<h2>匯出備份<button data-x>關閉</button></h2>
    <div class="small">內含班表、備忘錄、待辦。把整段文字複製起來，貼到 LINE 給自己或存在別的地方。</div>
    <textarea id="exTxt" style="height:160px;margin-top:8px" readonly>${esc(txt)}</textarea><button class="btn" id="exCopy">複製</button>`);
  $('exCopy').onclick=()=>{
    const fb=()=>{const t=$('exTxt');t.focus();t.select();toast('已選取，請按「拷貝」')};
    try{navigator.clipboard.writeText(txt).then(()=>toast('已複製'),fb)}catch(e){fb()}

function openImport(){
  openSheet(`<h2>匯入備份<button data-x>關閉</button></h2>
    <div class="small">貼上之前匯出的文字。會取代目前所有資料。</div>
    <textarea id="imTxt" style="height:160px;margin-top:8px" placeholder="貼在這裡"></textarea><button class="btn" id="imGo">匯入</button>`);
  $('imGo').onclick=async()=>{
    let d;try{d=JSON.parse($('imTxt').value)}catch(e){return toast('格式不正確，請貼上完整的備份文字')}
    if(!d||!Array.isArray(d.types))return toast('格式不正確，請貼上完整的備份文字');
    if(!await ask('確定用備份取代目前資料？','取代',true))return;
    S={sample:!!d.sample,types:d.types,days:d.days||{},cycles:migrateCycles(d),memos:d.memos||[],todos:d.todos||[],hol:d.hol||{show:true,off:false}};save();closeSheet();toast('匯入完成');
  };
}
function openHelp(){openSheet(`<h2>使用說明<button data-x>關閉</button></h2><div class="help">${HELP.map(h=>'<p>'+esc(h)+'</p>').join('')}</div>`)}

/* ===== 分享圖片 ===== */
function drawMonth(){
  const W=7*120,top=150,ch=150,cells=monthCells();
  const cv=document.createElement('canvas');cv.width=W+20;cv.height=top+6*ch+70;
  const g=cv.getContext('2d'),F='-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  g.fillStyle='#f1f4f9';g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle='#111';g.textAlign='center';g.textBaseline='middle';
  g.font='500 46px '+F;g.fillText(view.getFullYear()+'年'+(view.getMonth()+1)+'月',cv.width/2,55);
  g.font='30px '+F;WK.forEach((w,i)=>g.fillText('週'+w,10+i*120+60,120));
  const tk=ymd(today),cnt={};
  cells.forEach((d,i)=>{
    const x=10+(i%7)*120,y=top+Math.floor(i/7)*ch,k=ymd(d),t=shiftOf(k),out=d.getMonth()!==view.getMonth();
    if(!out&&t)cnt[t.id]=(cnt[t.id]||0)+1;
    g.fillStyle=out?'#f8fafc':k===tk?'#fffbeb':t?t.color:'#fff';g.fillRect(x,y,120,ch);
    g.strokeStyle='#8f8f8f';g.lineWidth=2;g.strokeRect(x,y,120,ch);
    g.fillStyle=out?'#888':(k===tk||!t)?'#111':textColor(t.color);
    const hn=S.hol.show?HOLIDAYS[k]:'';
    g.font='34px '+F;g.fillText(d.getDate(),x+60,y+42);
    if(hn){g.font='bold 20px '+F;const w=Math.min(112,g.measureText(hn).width+16);
      g.fillStyle=hn.includes('補假')?'#fcd34d':'rgba(255,255,255,.92)';g.beginPath();g.roundRect?g.roundRect(x+60-w/2,y+63,w,26,13):g.rect(x+60-w/2,y+63,w,26);g.fill();
      g.fillStyle=hn.includes('補假')?'#7c2d12':'#c81e1e';g.fillText(hn,x+60,y+77,108);
      g.fillStyle=out?'#888':(k===tk||!t)?'#111':textColor(t.color)}
    if(t){const n=t.name;g.font=(n.length>=4?24:n.length===3?28:32)+'px '+F;g.fillText(n,x+60,y+108)}
    const e=S.days[k];if(e&&e.note&&!out){g.font='bold 30px '+F;g.fillText('*',x+104,y+20)}
  });
  g.font='26px '+F;g.fillStyle='#334';
  g.fillText(S.types.filter(t=>cnt[t.id]).map(t=>t.name+' '+cnt[t.id]+'天').join('　'),cv.width/2,top+6*ch+36);
  return cv;
}
$('shareBtn').onclick=()=>{

window.addEventListener('resize',()=>{if(tab==='cal')renderCal()});
let tt;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1700)}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(+t!==+today){today=t;renderAll()}
});
// App 開著時，到了待辦的提醒時間就跳出橫幅
function checkReminders(){
  // 手寫畫面開著時先不跳，等關掉後下一次檢查再跳
  if($('remBar')||!$('draw').hidden)return;
  const now=new Date(),tk=ymd(now);S.rem=S.rem||{};
  const it=todoItems(ymAdd(ymOf(tk),-1),ymAdd(ymOf(tk),1)).find(i=>{
    if(i.done||!i.t.time||!i.date)return false;
    const[h,mi]=i.t.time.split(':').map(Number),at=parse(i.date);at.setHours(h,mi);const fire=+at-(i.t.remind||0)*60000;
    return now>=fire&&now-fire<6*3600000&&!S.rem[i.key];
  });
  if(!it)return;
  const b=document.createElement('div');b.id='remBar';
  b.innerHTML=`<div class="ic">⏰</div><div class="tx"><b>${esc(it.t.text)}</b><span>${fmtMD(it.date)} ${it.t.time}</span></div><button class="ok" data-a="done">完成</button><button data-a="ok">知道了</button>`;
  b.onclick=e=>{const a=e.target.closest('[data-a]');if(!a)return;S.rem[it.key]=1;
    if(a.dataset.a==='done')toggleItem(it.key);
    // 只留最近的紀錄
    const ks=Object.keys(S.rem);if(ks.length>200)ks.slice(0,ks.length-200).forEach(k=>delete S.rem[k]);
    save();b.remove();renderAll();setTimeout(checkReminders,300)};
  document.body.appendChild(b);
  try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
}
setInterval(()=>{applyTheme();checkReminders()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){applyTheme();checkReminders()}});
applyTheme();
renderAll();
setTimeout(checkReminders,800);
if('serviceWorker' in navigator&&location.protocol==='https:'&&window.top===window)navigator.serviceWorker.register('sw.js').catch(()=>{});
