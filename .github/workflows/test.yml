name: 自動化測試
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # Playwright 1.56 還不支援 ubuntu-latest（26.04），先固定用 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
